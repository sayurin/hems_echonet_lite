name: Validate

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.1
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Install actions-lock extension
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify workflow dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
      - name: Validate commit messages and PR title
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run --locked --extra dev python scripts/check_commit_messages.py "$BASE_SHA" "$HEAD_SHA" --title "$PR_TITLE"
      - name: Run prek
        run: uv run --locked --extra dev prek run --all-files
      - name: Run offline tests
        run: uv run --locked --extra dev pytest
      - name: Audit dependencies
        run: uv audit --locked
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.25.0
          cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Lint workflows
        run: |
          "$(go env GOPATH)/bin/actionlint"

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: false

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master
